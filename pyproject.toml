# Metadados e configuracao de ferramentas do NetWorth.
#
# Mesma forma dos projetos irmaos: as dependencias vivem aqui, em `[project]`,
# e servem tanto a imagem quanto o venv de desenvolvimento.

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "networth"
version = "0.1.0"
description = "Consolidador de patrimonio, so leitura, sobre o Controle Bancario e o Controle de Renda Variavel."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "Django>=5.2,<7",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=26.0.0,<27",
  "whitenoise>=6.12.0,<7",
  # Cabecalhos de seguranca, formatacao pt-BR e leitura de segredo, iguais aos
  # dos irmaos. **Sem o extra `[flask]`**: o nucleo e Python puro, e pedir o
  # extra traria Flask para dentro de uma imagem Django.
  "sharedauth @ git+https://github.com/MSPA-Coder/SharedAuth.git@v0.11.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.12,<1",
  "pytest>=8.3,<10",
  "pytest-django>=4.9,<5",
  "pip-audit>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["consolidado", "networth"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["consolidado", "networth", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "networth.settings"
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["."]
