<section class="wf2-chart-panel" aria-label="{{ chart.aria_label|default:'Evolução financeira' }}">
  {% if chart.empty %}
    <div class="wf2-chart wf2-chart--empty" role="img" aria-label="Sem histórico"><span>{{ chart.empty_message|default:'O gráfico aparecerá quando houver histórico suficiente.' }}</span></div>
  {% elif chart.geometry %}
    <div class="wf2-chart" role="img" aria-label="{{ chart.aria_label|default:'Evolução financeira' }}"><svg viewBox="0 0 {{ chart.geometry.largura }} {{ chart.geometry.altura }}" preserveAspectRatio="none" aria-hidden="true">{% for mark in chart.y_marks %}<line x1="{{ chart.geometry.esquerda }}" y1="{{ mark.posicao }}" x2="{{ chart.geometry.direita }}" y2="{{ mark.posicao }}" class="wf2-chart__grid"></line><text x="{{ chart.geometry.esquerda|add:'-8' }}" y="{{ mark.posicao|add:'4' }}" class="wf2-chart__axis-label wf2-chart__axis-label--y">{{ mark.rotulo }}</text>{% endfor %}{% for mark in chart.x_marks %}<line x1="{{ mark.posicao }}" y1="{{ chart.geometry.topo }}" x2="{{ mark.posicao }}" y2="{{ chart.geometry.base }}" class="wf2-chart__grid wf2-chart__grid--vertical"></line><text x="{{ mark.posicao }}" y="{{ chart.geometry.altura|add:'-8' }}" class="wf2-chart__axis-label wf2-chart__axis-label--x">{{ mark.rotulo }}</text>{% endfor %}{% for curve in chart.geometry.curvas %}{% if not chart.series_class or curve.classe == chart.series_class %}<path d="{{ curve.caminho }} L{{ chart.geometry.direita }} {{ chart.geometry.base }} L{{ chart.geometry.esquerda }} {{ chart.geometry.base }} Z" class="wf2-chart__area {{ chart.series_class }}"></path><path d="{{ curve.caminho }}" class="wf2-chart__line {{ chart.series_class }}"></path>{% endif %}{% endfor %}{% for curve in chart.curves %}{% for point in curve.points %}<circle cx="{{ point.x }}" cy="{{ point.y }}" r="2.4" class="wf2-chart__point {{ chart.series_class }}"><title>{{ point.date }} · {{ point.value }}</title></circle>{% endfor %}{% endfor %}</svg></div>
  {% else %}
    <div class="wf2-chart wf2-chart--empty" role="img" aria-label="Sem histórico"><span>{{ chart.empty_message|default:'Não há histórico para o período selecionado.' }}</span></div>
  {% endif %}
</section>
