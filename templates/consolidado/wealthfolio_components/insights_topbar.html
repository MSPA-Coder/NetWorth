<nav class="wf2-dashboard-tabs" aria-label="Seções de análises">
  <a class="wf2-dashboard-tabs__link{% if wf_insights.tab == 'summary' %} is-active{% endif %}" href="{% url 'consolidado:insights' %}?tab=summary&amp;periodo={{ wf_insights.period|default:'1a' }}">Resumo</a>
  <a class="wf2-dashboard-tabs__link{% if wf_insights.tab == 'performance' %} is-active{% endif %}" href="{% url 'consolidado:insights' %}?tab=performance&amp;periodo={{ wf_insights.period|default:'1a' }}">Desempenho</a>
  <a class="wf2-dashboard-tabs__link{% if wf_insights.tab == 'income' %} is-active{% endif %}" href="{% url 'consolidado:insights' %}?tab=income&amp;periodo={{ wf_insights.period|default:'1a' }}">Rendimentos</a>
</nav>
<form class="wf2-insights-account" method="get" action="{% url 'consolidado:insights' %}">
  <input type="hidden" name="tab" value="{{ wf_insights.tab|default:'summary' }}">
  <input type="hidden" name="periodo" value="{{ wf_insights.period|default:'1a' }}">
  <label for="wf2-insights-account">Conta</label>
  <select id="wf2-insights-account" name="grupo">
    <option value="">Todas as contas</option>
    {% for grupo in wf_insights.account_options %}<option value="{{ grupo.id }}">{{ grupo.name }}</option>{% endfor %}
  </select>
  <button type="submit">Aplicar</button>
</form>
