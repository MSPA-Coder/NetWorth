{% extends "base.html" %}

{% block titulo %}Entrar — NetWorth{% endblock %}

{% block conteudo %}
<section class="entrada">
  <h1>NetWorth</h1>
  <p class="sub">Quanto você tem, somando os dois sistemas.</p>

  {% if form.errors %}
    <p class="aviso destaque">Usuário ou senha inválidos.</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <label for="id_username">Usuário</label>
    <input id="id_username" type="text" name="username" autocomplete="username" required autofocus>
    <label for="id_password">Senha</label>
    <input id="id_password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  </form>
</section>
{% endblock %}
